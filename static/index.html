<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js"></script>
    <title>MakeYourMove</title>
</head>

<body>
    

    <h1>Make Your Move</h1>
    <h2>Login:</h2>

    <form action="api/users" method="post" name="loginform" id="loginform">
        <span>Logged User:</span>
        <span id="loggedUser"></span>
        <input name="email" value="test.test@gmail.com" id="loginEmail" />
        <input name="pwd" value="passwordTest" id="loginPassword" />
        <button type="button" onclick="login()">LogIn</button>
    </form>
    
    <div class="UserBase">
        <h2>Elenco Stazioni:</h2>
        <ul id="Stazioni"></ul>
    </div>

    <span>
        <h2>Richiesta tratta:</h2>
        <input name = "stationA" value="Stazione di partenza" type="text"/>
        <input name = "stationB" value="Stazione di arrivo" type="text"/>
        <input name = "dateOfDeparture" value="Data e ora di partenza (YYYY-MM-DDTHH:MM:SS.mmmZ)" type="text"/>
        <button>Invia</button>
    </span>

    <div>
        <h2>Mappa:</h2>
        <iframe width="425" height="350" src="https://www.openstreetmap.org/export/embed.html?bbox=11.109945774078371%2C46.06735033774401%2C11.127862930297852%2C46.07372186159198&amp;layer=transportmap" style="border: 1px solid black"></iframe><br/><small><a href="https://www.openstreetmap.org/?#map=17/46.070536/11.118904&amp;layers=T">Visualizza mappa ingrandita</a></small>
    </div>

    <div class="UserBase">
        <h2>Statistiche:</h2>
        <ul id="Operator"></ul>
    </div>

    <div class="UserBase">
        <h2>Richieste utenti:</h2>
        <ul id="Operator"></ul>
    </div>

    <form action="api/stations" method="post" name="stationform" id="stationform">
        <h2>Inserisci fermata:</h2>
        <span>Nuova fermata:</span>
        <span id="loggedUser"></span>
        <input name="email" value="test.test@gmail.com" id="loginEmail" />
        <input name="pwd" value="passwordTest" id="loginPassword" />
        <button type="button" onclick="login()">LogIn</button>
    </form>
</body>

</html>
