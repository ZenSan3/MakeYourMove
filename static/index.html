<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js"></script>
    <title>MakeYourMove</title>
</head>

<body>
    

    <h1>Make Your Move</h1>
    <h2>Registrati:</h2>
    <form action="api/users" method="post" name="registerform" id="registerform">
        <span id="Creation">Crea il tuo Utente</span>
        <input name="user" value="username" id="createUsername" />
        <input name="email" value="email" id="createEmail" />
        <input name="pwd" type="password" value="password" id="createPassword" />
        <button type="button" onclick="createUser()">Crea</button>
    </form>

    <h2>Login:</h2>
    <form action="api/users" method="post" name="loginform" id="loginform">
        <span>Logged User:</span>
        <span id="loggedUser"></span>
        <input name="email" value="email" id="loginEmail" />
        <input name="pwd" type="password" value="password" id="loginPassword" />
        <button type="button" onclick="login()">LogIn</button>
    </form>
    
    <div class="UserBase">
        <h2>Elenco Stazioni:</h2>
        <ul id="Stazioni"></ul>
    </div>

    <div id="rRoot" style="visibility: hidden;">
        <h2>Richiesta tratta:</h2>
        <input name = "stationA" value="Stazione di partenza" id="routeA" type="text"/>
        <input name = "stationB" value="Stazione di arrivo" id="routeB" type="text"/>
        <input name = "dateOfDeparture" value="Data e ora di partenza (YYYY-MM-DDTHH:MM:SS.mmmZ)" id="routeDate" type="text"/>
        <button type="button" onclick="sendRoute()">Invia</button>
    </div>

    <div>
        <h2>Mappa:</h2>
        <iframe width="425" height="350" src="https://www.openstreetmap.org/export/embed.html?bbox=11.109945774078371%2C46.06735033774401%2C11.127862930297852%2C46.07372186159198&amp;layer=transportmap" style="border: 1px solid black"></iframe><br/><small><a href="https://www.openstreetmap.org/?#map=17/46.070536/11.118904&amp;layers=T">Visualizza mappa ingrandita</a></small>
    </div>

    <div id="Operator"></div>

    <div id="nStations" style="visibility:hidden">
        <form action="api/stations" method="post" name="stationform" id="stationform">
            <h2>Inserisci fermata:</h2>
            <span>Nuova fermata:</span>
            <span id="stationCreation"></span>
            <input name="name" value="Nome fermata" id="stationName" />
            <input name="address" value="Indirizzo" id="stationAddress" />
            <input name="city" value="città" id="stationCity" />
            <input name="CAP" value="CAP" id="stationCAP" />
            <button type="button" onclick="admin()">Invia</button>
        </form>
    </div>

    <div id="Users"></div>

    <div id="Settings"></div>

</body>

</html>
